services:
  benchmark:
    image: appajidheeraj/dynamic-batch-formation-simulator:latest
    build: .
    command: python -m batch_bench.experiment
    volumes:
      - ./results:/app/results
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
